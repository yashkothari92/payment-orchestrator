spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/payments
    username: payments
    password: payments
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

timeout:
  psp-timeout: 10s
  lock-margin: 15s

management:
  endpoints:
    web:
      exposure:
        include: health